# ============================================
# S3E System PRO - Docker Compose (Desenvolvimento com Hot Reload)
# ============================================
# Desenvolvimento local: API + Vite + Postgres + Evolution Go + PgAdmin.
#
# IMPORTANTE: o provedor WhatsApp em DEV é Evolution Go (evoapicloud/evolution-go),
# mesmo binário usado em produção. Mantemos paridade com prod para reproduzir
# bugs do provedor sem precisar trocar de versão. Não é Evolution API v2.
#
# Passo a passo:
#   1. cp .env.example .env   (ou copie a secção "DEV em Docker" do .env.example)
#   2. Ajuste WHATSAPP_PROVIDER_API_KEY e, se quiser, DB_USER / DB_PASSWORD
#   3. docker compose up --build
#
# URLs: Frontend http://localhost:5173  |  API http://localhost:3001  |  EvoGo Manager http://localhost:3333/manager
# PgAdmin: http://localhost:5050
#
# O Compose lê o ficheiro `.env` na raiz (interpolação + env_file nos serviços).
# Produção: docker compose -f docker-compose.prod.yml --env-file .env up -d
# ============================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: s3e-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: ${DB_USER:-s3e_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password_local}
      POSTGRES_DB: ${DB_NAME:-s3e_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups # Pasta para backups manuais
      - ./docker/postgres/02-evolution-database.sql:/docker-entrypoint-initdb.d/02-evolution-database.sql:ro
      # Bases evogo_* (Evolution Go) — criadas na 1ª inicialização do volume; ignoradas se usar só Evolution API v2 no dev
      - ./docker/postgres/03-evolution-go-databases.sql:/docker-entrypoint-initdb.d/03-evolution-go-databases.sql:ro
    networks:
      - s3e-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-s3e_dev} -d ${DB_NAME:-s3e_dev}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Evolution Go (mesmo binário da prod). Mantém o nome do serviço `whatsapp-provider`
  # para o backend continuar usando WHATSAPP_PROVIDER_BASE_URL=http://whatsapp-provider:8080
  # sem precisar trocar nada entre dev e prod.
  whatsapp-provider:
    image: evoapicloud/evolution-go:0.7.1
    container_name: s3e-whatsapp-provider-dev
    restart: unless-stopped
    env_file:
      - .env
    # Tempo para o processo Go encerrar antes do Docker enviar SIGKILL.
    stop_grace_period: 30s
    # DNS explícito evita falha intermitente de resolução no WSL2 → socket WhatsApp não completa.
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      SERVER_PORT: "8080"
      CLIENT_NAME: ${EVOLUTION_GO_CLIENT_NAME:-s3e}
      GLOBAL_API_KEY: ${WHATSAPP_PROVIDER_API_KEY:-s3e-dev-change-me}
      # Conecta nas bases `evogo_auth` / `evogo_users` (criadas pelo
      # `docker/postgres/03-evolution-go-databases.sql` na 1ª inicialização do volume).
      POSTGRES_AUTH_DB: postgresql://${DB_USER:-s3e_dev}:${DB_PASSWORD:-dev_password_local}@postgres:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://${DB_USER:-s3e_dev}:${DB_PASSWORD:-dev_password_local}@postgres:5432/evogo_users?sslmode=disable
      # Mantemos histórico de mensagens no CRM (backend Prisma), não na base da EvoGo.
      DATABASE_SAVE_MESSAGES: "false"
      WADEBUG: ${EVOLUTION_GO_WADEBUG:-INFO}
      LOGTYPE: console
      # Não tenta auto-conectar instâncias antigas no boot — operador faz login pelo Manager.
      CONNECT_ON_STARTUP: "false"
      # Repassar arquivos de mídia (foto/áudio/vídeo) no webhook em vez de só URL.
      WEBHOOK_FILES: "true"
      # Webhook global → CRM S3E (porta interna do backend = 3001 em dev)
      WEBHOOK_URL: http://backend:3001/api/webhooks/whatsapp
      OS_NAME: Linux
      # Janela máxima de QR antes da EvoGo expirar (em segundos × tentativas).
      QRCODE_MAX_COUNT: ${WHATSAPP_PROVIDER_QRCODE_LIMIT:-60}
    ports:
      - "${WHATSAPP_PROVIDER_HTTP_PORT:-3333}:8080"
    volumes:
      - evolution_go_dbdata_dev:/app/dbdata
      - evolution_go_logs_dev:/app/logs
    networks:
      - s3e-network
    healthcheck:
      # Endpoint nativo de healthcheck da EvoGo (retorna 200 OK quando o servidor sobe).
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8080/server/ok >/dev/null 2>&1 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Backend API - Desenvolvimento com Hot Reload
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development # ✅ Usa stage de desenvolvimento para hot reload
    container_name: s3e-backend-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development # ✅ Modo desenvolvimento
      TZ: America/Sao_Paulo # Horário Brasília (evita rejeição 703 na NF-e)
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-s3e_dev}:${DB_PASSWORD:-dev_password_local}@postgres:5432/${DB_NAME:-s3e_dev}?schema=public&connection_limit=10
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:80,http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3001}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-32-chars-min!!}
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FISCAL_HOST: ${SMTP_FISCAL_HOST:-}
      SMTP_FISCAL_PORT: ${SMTP_FISCAL_PORT:-465}
      SMTP_FISCAL_SECURE: ${SMTP_FISCAL_SECURE:-true}
      SMTP_FISCAL_USER: ${SMTP_FISCAL_USER:-}
      SMTP_FISCAL_PASS: ${SMTP_FISCAL_PASS:-}
      SMTP_FISCAL_FROM: ${SMTP_FISCAL_FROM:-}
      NFSE_XSD_PATH: /app/nfse-xsd
      # Default `evolution-go` (paridade com prod). Permite override via .env
      # caso queira apontar para uma instância v2 externa em testes pontuais.
      WHATSAPP_PROVIDER_KIND: ${WHATSAPP_PROVIDER_KIND:-evolution-go}
      WHATSAPP_PROVIDER_BASE_URL: http://whatsapp-provider:8080
      WHATSAPP_PROVIDER_SESSION: ${WHATSAPP_PROVIDER_SESSION:-default}
      WHATSAPP_PROVIDER_INTEGRATION: ${WHATSAPP_PROVIDER_INTEGRATION:-WHATSAPP-BAILEYS}
      # Mesmo valor que GLOBAL_API_KEY da EvoGo (dev: default alinhado ao whatsapp-provider).
      WHATSAPP_PROVIDER_API_KEY: ${WHATSAPP_PROVIDER_API_KEY:-s3e-dev-change-me}
      # Token específico de uma instância criada na EvoGo (opcional em dev — fica vazio até criar a primeira instância pelo Manager).
      WHATSAPP_PROVIDER_GO_INSTANCE_TOKEN: ${WHATSAPP_PROVIDER_GO_INSTANCE_TOKEN:-}
      WHATSAPP_PROVIDER_SEND_PRESENCE: ${WHATSAPP_PROVIDER_SEND_PRESENCE:-composing}
      WHATSAPP_PROVIDER_SEND_DELAY_MS: ${WHATSAPP_PROVIDER_SEND_DELAY_MS:-1500}
      # Fila/mutex global de envio (anti-ban). Ver backend/src/services/whatsappSendQueue.service.ts.
      WHATSAPP_SEND_JITTER_MS_MIN: ${WHATSAPP_SEND_JITTER_MS_MIN:-2000}
      WHATSAPP_SEND_JITTER_MS_MAX: ${WHATSAPP_SEND_JITTER_MS_MAX:-5000}
      WHATSAPP_SEND_LOCK_TIMEOUT_MS: ${WHATSAPP_SEND_LOCK_TIMEOUT_MS:-120000}
      WHATSAPP_SEND_LOCK_DISABLE: ${WHATSAPP_SEND_LOCK_DISABLE:-}
      WHATSAPP_SEND_DEBUG: ${WHATSAPP_SEND_DEBUG:-}
      WHATSAPP_PROVIDER_DASHBOARD_PUBLIC_URL: ${WHATSAPP_PROVIDER_DASHBOARD_PUBLIC_URL:-http://localhost:3333/manager}
      WHATSAPP_PROVIDER_PUBLIC_URL: ${WHATSAPP_PROVIDER_PUBLIC_URL:-http://localhost:3333}
      WHATSAPP_MEDIA_ALLOWED_HOSTS: ${WHATSAPP_MEDIA_ALLOWED_HOSTS:-mmg.whatsapp.net,pps.whatsapp.net}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
    ports:
      - "3001:3001"
      - "5555:5555"
    volumes:
      # ✅ Hot Reload: Monta o código fonte para mudanças refletirem automaticamente
      - ./backend/src:/app/src # Código fonte (rw para hot reload)
      - ./backend/prisma:/app/prisma # Schema Prisma
      - ./backend/scripts:/app/scripts # Scripts utilitários (dev bootstrap, etc.)
      - ./backend/package.json:/app/package.json
      - ./backend/package-lock.json:/app/package-lock.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/tsconfig.build.json:/app/tsconfig.build.json
      - backend_uploads:/app/uploads # Uploads persistentes
      - backend_logs:/app/logs # Logs da aplicação
      - ./nfse-xsd:/app/nfse-xsd:ro
      - ./PL_010b_NT2025_002_v1.30:/app/PL_010b_NT2025_002_v1.30:ro # XSDs de validação NF-e
      - ./backend/certs:/app/certs:ro # CA bundle ICP-Brasil para mTLS SEFAZ
      - ./backend:/app/backend      # node_modules usa os da imagem (já instalados durante o build)     # Não montamos volume para evitar sobrescrever dependências instaladas
      - /etc/localtime:/etc/localtime:ro # Horário Brasília
    depends_on:
      postgres:
        condition: service_healthy
      whatsapp-provider:
        condition: service_started
    networks:
      - s3e-network
    # ✅ Comando de desenvolvimento: sincroniza node_modules com package.json (novas deps, ex.: xlsx), depois Prisma e watch
    # Sem "npm install" na subida, dependências adicionadas no host podem faltar na imagem antiga (Cannot find module 'xlsx').
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run dev"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend React App - Desenvolvimento com Hot Reload
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development # ✅ Usa stage de desenvolvimento para hot reload
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    container_name: s3e-frontend-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    ports:
      - "5173:5173" # ✅ Porta do Vite dev server (hot reload)
    volumes:
      # ✅ Hot Reload: Monta o código fonte para mudanças refletirem automaticamente
      - ./frontend/src:/app/src # Código fonte (rw para hot reload)
      - ./frontend/public:/app/public # Arquivos públicos
      - ./frontend/index.html:/app/index.html
      - ./frontend/package.json:/app/package.json # Para npm install ver deps atualizadas
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      # Volume isolado: npm install no startup instala binários Linux (rollup, etc.)
      - frontend_node_modules:/app/node_modules
    networks:
      - s3e-network
    depends_on:
      - backend
    # Instala deps (binários Linux) no startup, depois inicia Vite
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0"
    # Não precisa de healthcheck no modo dev, Vite já tem seu próprio sistema

  # PgAdmin (opcional — credenciais em PGADMIN_* no .env)
  pgadmin:
    image: dpage/pgadmin4:8.11
    container_name: s3e-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - s3e-network

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  frontend_node_modules:
    driver: local
  pgadmin_data:
    driver: local
  evolution_go_dbdata_dev:
    driver: local
  evolution_go_logs_dev:
    driver: local

networks:
  s3e-network:
    driver: bridge
