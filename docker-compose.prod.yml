# ============================================
# S3E System PRO - Docker Compose (PRODUÇÃO)
# ============================================
# Credenciais ficam fora do Git: use um arquivo .env na mesma pasta deste compose.
#
# No servidor (TrueNAS Scale / VPS):
# 1. Copie o modelo: cp docker-compose.prod.env.example .env
# 2. Edite .env (DB_*, JWT_SECRET, URLs, WHATSAPP_PROVIDER_API_KEY, SMTP, etc.)
# 3. Crie os volumes externos listados no rodapé de docker-compose.prod.env.example
# 4. Execute: docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# WhatsApp: apenas Evolution API (serviço whatsapp-provider). WAHA não é mais usado.
# Desenvolvimento local: docker-compose.yml
# ============================================

services:
  # PostgreSQL Database - PRODUÇÃO
  postgres:
    image: postgres:16-alpine
    container_name: s3e-postgres-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups # Pasta para backups manuais
      - ./docker/postgres/02-evolution-database.sql:/docker-entrypoint-initdb.d/02-evolution-database.sql:ro
    networks:
      - s3e-network-prod
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Evolution API v2 — serviço nomeado `whatsapp-provider` (backend: WHATSAPP_PROVIDER_BASE_URL=http://whatsapp-provider:8080)
  whatsapp-provider:
    image: evoapicloud/evolution-api:v2.3.5
    container_name: s3e-whatsapp-provider-prod
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: "2gb"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://whatsapp-provider:8080
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${EVOLUTION_DATABASE_NAME:-evolution}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: ${EVOLUTION_DATABASE_CLIENT_NAME:-s3e_evolution_prod}
      AUTHENTICATION_API_KEY: ${WHATSAPP_PROVIDER_API_KEY:-}
      LANGUAGE: pt-BR
      CORS_ORIGIN: "*"
      CORS_METHODS: POST,GET,PUT,DELETE
      CORS_CREDENTIALS: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      # Evolution: aumenta janela de leitura do QR antes de gerar outro
      QRCODE_LIMIT: ${WHATSAPP_PROVIDER_QRCODE_LIMIT:-60}
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://backend:3001/api/webhooks/whatsapp
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_PRESENCE_UPDATE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
    ports:
      - "${WHATSAPP_PROVIDER_HTTP_PORT:-3333}:8080"
    volumes:
      - apps_whatsapp_provider_sessions:/evolution/instances
    networks:
      - s3e-network-prod
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Backend API - PRODUÇÃO
  backend:
    image: odev10antonio/s3e-backend:1.3.1
    container_name: s3e-backend-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      NODE_ENV: production
      PORT: 3001
      # connection_limit evita "too many clients" no PostgreSQL (singleton Prisma usa um pool só)
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?connection_limit=10
      ENABLE_PRISMA_AUDIT: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CORS_ORIGIN: ${CORS_ORIGIN}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FISCAL_HOST: ${SMTP_FISCAL_HOST}
      SMTP_FISCAL_PORT: ${SMTP_FISCAL_PORT}
      SMTP_FISCAL_SECURE: ${SMTP_FISCAL_SECURE}
      SMTP_FISCAL_USER: ${SMTP_FISCAL_USER}
      SMTP_FISCAL_PASS: ${SMTP_FISCAL_PASS}
      SMTP_FISCAL_FROM: ${SMTP_FISCAL_FROM}
      NFSE_XSD_PATH: /app/nfse-xsd
      # WhatsApp Evolution — URL interna Docker; API key = AUTHENTICATION_API_KEY da Evolution
      WHATSAPP_PROVIDER_KIND: ${WHATSAPP_PROVIDER_KIND:-evolution}
      WHATSAPP_PROVIDER_BASE_URL: http://whatsapp-provider:8080
      WHATSAPP_PROVIDER_SESSION: ${WHATSAPP_PROVIDER_SESSION:-testeCellJR}
      WHATSAPP_PROVIDER_INTEGRATION: ${WHATSAPP_PROVIDER_INTEGRATION:-WHATSAPP-BAILEYS}
      WHATSAPP_PROVIDER_API_KEY: ${WHATSAPP_PROVIDER_API_KEY:-}
      WHATSAPP_PROVIDER_DASHBOARD_PUBLIC_URL: ${WHATSAPP_PROVIDER_DASHBOARD_PUBLIC_URL:-http://localhost:3333/manager}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
    ports:
      - "3001:3001"
    volumes:
      - backend_uploads:/app/uploads # Uploads persistentes (logos, imagens, etc)
      - backend_logs:/app/logs # Logs da aplicação
      - backend_certificados:/app/data/certificados # Certificados digitais NF-e
      - ./PL_010b_NT2025_002_v1.30:/app/PL_010b_NT2025_002_v1.30:ro # XSDs de validação NF-e (read-only)
      - ./nfse-xsd:/app/nfse-xsd:ro # XSDs NFS-e Pública/Itajaí v7.4 (opcional; mesmo nível do docker-compose.prod.yml)
    depends_on:
      postgres:
        condition: service_healthy
      whatsapp-provider:
        condition: service_started
    networks:
      - s3e-network-prod
    # ✅ Comando de produção: aplica migrations, seed e inicia a aplicação. (Prisma Client já vem gerado na imagem.)
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/app.js"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend React App - PRODUÇÃO
  frontend:
    image: odev10antonio/s3e-frontend:1.3.1
    container_name: s3e-frontend-prod
    restart: unless-stopped
    ports:
      - "8080:80" # Porta 8080 no host (TrueNAS) para porta 80 do container
    networks:
      - s3e-network-prod
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # PgAdmin - PRODUÇÃO (Opcional)
  pgadmin:
    image: dpage/pgadmin4:8.11
    container_name: s3e-pgadmin-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80" # Acesse em http://192.168.100.228:5050
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - s3e-network-prod

volumes:
  postgres_data:
    name: apps_postgres_data
    external: true
  backend_uploads:
    name: apps_backend_uploads
    external: true
  backend_logs:
    name: apps_backend_logs
    external: true
  backend_certificados:
    name: apps_backend_certificados
    external: true
  pgadmin_data:
    driver: local
  apps_whatsapp_provider_sessions:
    name: apps_whatsapp_provider_sessions
    external: true

networks:
  s3e-network-prod:
    driver: bridge
